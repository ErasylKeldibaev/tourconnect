name: tourconnect
description: "A professional travel mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  google_fonts: ^6.1.0
  animate_do: ^3.3.4
  cached_network_image: ^3.3.0
  
  # Firebase
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  
  # Maps
  google_maps_flutter: ^2.17.0
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
